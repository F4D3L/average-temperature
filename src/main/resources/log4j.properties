# Apenas avisos dos componentes internos do Hadoop, mas o progresso e os contadores do job
# (por exemplo "Map input records" e MALFORMED) aparecem quando ele roda em modo local.
log4j.rootLogger=WARN, console
log4j.logger.org.apache.hadoop.mapreduce.Job=INFO

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{HH:mm:ss} %-5p %c{1} - %m%n
